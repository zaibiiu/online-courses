<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GlobeLearn · Student Dashboard</title>
<meta name="description" content="GlobeLearn dashboard: courses, online tests, Digital Library, AI tutor, packages, and certificates.">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f3f9f5;--sf:#fff;--ink:#12372a;--mu:#5b7267;--ln:#dbe7e0;--dp:#06402b;--dk:#04281b;--br:#16a34a;--mt:#4ade80;--sl:#e6f6ec;--am:#f59e0b;--as:#fff3d6;--sh:0 1px 2px rgba(6,78,50,.05),0 10px 28px -14px rgba(6,78,50,.2);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:12}
.i{width:20px;height:20px;flex:none}
.app{display:grid;grid-template-columns:262px 1fr;min-height:100vh}
aside{background:linear-gradient(180deg,var(--dp),var(--dk));color:#cdeedb;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;color:#fff;padding:2px 10px 20px;letter-spacing:-.01em}
.logo i{width:36px;height:36px;border-radius:11px;background:var(--br);display:grid;place-items:center;box-shadow:0 6px 16px -4px rgba(22,163,74,.7)}
.logo b{color:var(--mt)}
aside small{padding:8px 12px 4px;font-size:12px;color:#7fb897;font-weight:600}
nav{display:grid;gap:4px}
nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:#bfe6cd;text-decoration:none;font-weight:600;font-size:14px;transition:background .2s,color .2s}
nav a:hover{background:rgba(255,255,255,.08);color:#fff}
nav a.on{background:var(--br);color:#fff;box-shadow:0 8px 18px -8px rgba(22,163,74,.9)}
nav a em{margin-left:auto;font-style:normal;font-size:11px;font-weight:700;background:rgba(255,255,255,.14);padding:2px 8px;border-radius:99px}
.sw{margin-top:auto;background:rgba(255,255,255,.08);border-radius:16px;padding:14px;font-size:13px;color:#bfe6cd}
.sw p{margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;background:var(--br);color:#fff;text-decoration:none;transition:transform .15s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px -8px rgba(22,163,74,.8)}
.btn.w{background:#fff;color:var(--dp)}
.btn.g{background:var(--sl);color:var(--br)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--mt);outline-offset:2px}
main{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;display:flex;align-items:center;gap:14px;padding:16px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px)}
.top h1{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.top p{color:var(--mu);font-size:13px}
.sp{flex:1}
.mn{display:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);place-items:center;cursor:pointer}
.sr{position:relative;width:260px}
.sr .i{position:absolute;left:13px;top:11px;color:var(--mu);width:18px}
.sr input{width:100%;padding:11px 14px 11px 40px;border-radius:13px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font:inherit;font-size:14px}
.ib{position:relative;width:42px;height:42px;border-radius:12px;background:var(--sf);border:1px solid var(--ln);display:grid;place-items:center;color:var(--ink)}
.ib:after{content:"";position:absolute;top:9px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--am);border:2px solid var(--sf)}
.me{display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:4px 12px 4px 4px}
.av{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--br),var(--dp));color:#fff;display:grid;place-items:center;font-weight:800}
.me b{display:block;font-size:13.5px;line-height:1.2}
.me small{color:var(--mu);font-size:12px}
.v{padding:6px 28px 44px;display:grid;gap:18px;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
@keyframes g{from{width:0}}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:20px;box-shadow:var(--sh)}
h2{font-size:17px;font-weight:800;letter-spacing:-.01em}
h3{font-size:16px;font-weight:800;margin-bottom:2px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.hd a{font-size:13px;font-weight:700;color:var(--br);text-decoration:none}
.mu{color:var(--mu);font-size:13px}
.hero{background:radial-gradient(520px 240px at 100% 0,rgba(74,222,128,.28),transparent),linear-gradient(120deg,var(--dk),var(--dp));color:#fff;border-radius:24px;padding:30px;display:flex;gap:24px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hero h2{font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-.025em;max-width:470px}
.hero p{color:#bfe6cd;margin:10px 0 20px;max-width:440px}
.hero .r{display:flex;gap:10px;flex-wrap:wrap}
.ring{display:flex;align-items:center;gap:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:16px 22px}
.ring svg{width:90px;height:90px}
.ring b{display:block;font-size:17px}.ring span{color:#bfe6cd;font-size:13px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{display:flex;align-items:center;gap:14px;padding:16px}
.ic{width:46px;height:46px;border-radius:14px;background:var(--sl);color:var(--br);display:grid;place-items:center;flex:none}
.stat b{font-size:24px;line-height:1.1;display:block}.stat span{color:var(--mu);font-size:13px}
.g2{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;align-items:start}
.col{display:grid;gap:18px;min-width:0}
.row{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--ln)}
.row:first-of-type{border-top:0;padding-top:0}
.row .in{flex:1;min-width:0}.row strong{display:block;font-size:14.5px}
.bar{height:8px;background:var(--sl);border-radius:99px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--br),var(--mt));animation:g .9s ease}
.pct{font-weight:800;color:var(--br);min-width:42px;text-align:right}
.chart{display:flex;align-items:flex-end;gap:12px;height:150px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.chart i{width:100%;max-width:38px;border-radius:10px 10px 4px 4px;background:var(--sl)}
.chart i.h{background:linear-gradient(180deg,var(--mt),var(--br))}
.chart small{color:var(--mu);font-size:12px}
.ev{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--ln);align-items:center}
.ev:first-of-type{border-top:0;padding-top:0}
.dt{width:50px;border-radius:14px;background:var(--sl);text-align:center;padding:6px 0;flex:none;line-height:1.15}
.dt b{display:block;font-size:18px}.dt small{font-size:11px;color:var(--mu)}
.ev.w .dt{background:var(--as)}
.ev strong{display:block;font-size:14px}
.pk{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(120deg,#0b6b3f,var(--dp));color:#fff;border:0}
.tag{display:inline-block;background:rgba(255,255,255,.18);border-radius:99px;padding:3px 12px;font-size:12px;font-weight:700}
.pk h2{font-size:26px;margin:8px 0 2px}.pk p{color:#cfeedc;font-size:13.5px}
.mini{display:flex;gap:10px}.mini div{background:rgba(255,255,255,.1);border-radius:14px;padding:10px 16px;text-align:center}
.mini b{display:block;font-size:22px;line-height:1.2}.mini span{font-size:12px;color:#cfeedc}
.tabs{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.tab{display:flex;align-items:center;gap:10px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);padding:10px 14px;border-radius:14px;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:all .2s}
.tab b{color:var(--br);font-size:13px}.tab .i{color:var(--br)}
.tab.on{background:var(--br);border-color:var(--br);color:#fff}.tab.on b,.tab.on .i{color:#fff}
.cph{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.big{width:56px;height:56px;border-radius:16px;background:var(--sl);color:var(--br);display:grid;place-items:center}.big .i{width:28px;height:28px}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.tri div{background:var(--bg);border-radius:14px;padding:12px 14px}.tri b{font-size:22px;display:block;line-height:1.2}.tri span{font-size:12.5px;color:var(--mu)}
.lg{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.lc{display:flex;flex-direction:column;gap:10px;transition:transform .2s,box-shadow .2s}
.lc:hover{transform:translateY(-2px)}
.lt{display:flex;justify-content:space-between;align-items:center}
.nb{width:34px;height:34px;border-radius:10px;background:var(--sl);color:var(--br);display:grid;place-items:center;font-weight:800;font-size:13px}
.bd{border-radius:99px;padding:3px 11px;font-size:12px;font-weight:700;background:var(--sl);color:var(--br)}
.bd.o{background:var(--as);color:#b45309}.bd.l{background:var(--bg);color:var(--mu)}
.lc ul{list-style:none;padding:0;display:grid;gap:6px;font-size:13.5px}
.lc li{display:flex;gap:8px;align-items:center}.lc li .i{width:16px;height:16px;color:var(--br)}
.lf{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}
.th{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.pill{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:10px 14px}
.pill .i{color:var(--br)}.pill b{display:block;font-size:17px;line-height:1.2}.pill span{font-size:12px;color:var(--mu)}
.qn{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.qn button{width:36px;height:36px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}
.qn .a{background:var(--sl);border-color:var(--br);color:var(--br)}.qn .c{background:var(--br);color:#fff;border-color:var(--br)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:1.5px solid var(--ln);background:var(--sf);color:var(--ink);font:inherit;cursor:pointer;transition:all .15s;margin-top:10px}
.opt:hover{border-color:var(--br)}
.opt s{width:26px;height:26px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;font-size:12px;font-weight:800;text-decoration:none;flex:none}
.opt.on{border-color:var(--br);background:var(--sl)}.opt.on s{background:var(--br);border-color:var(--br);color:#fff}
.res{text-align:center;padding:10px 0}.res b{font-size:54px;line-height:1;color:var(--br);display:block}
.fl{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.bk{display:flex;flex-direction:column;gap:12px}
.cv{height:120px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--br),var(--dp))}
.cv.n{background:linear-gradient(135deg,#f59e0b,#b45309)}.cv .i{width:38px;height:38px}
.bk strong{font-size:14.5px;line-height:1.3;display:block}
.soon{text-align:center;padding:56px 20px;display:grid;justify-items:center;gap:12px}
.soon .big{width:96px;height:96px;border-radius:28px}.soon .big .i{width:48px;height:48px}
.soon h2{font-size:26px}.soon p{max-width:420px;color:var(--mu)}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pc{display:flex;flex-direction:column;gap:10px}
.pc.cur{border:2px solid var(--br)}
.pc .pr{font-size:28px;font-weight:800;letter-spacing:-.02em}
.pc ul,.inc{list-style:none;padding:0;display:grid;gap:7px;font-size:13.5px}
.pc li,.inc li{display:flex;gap:8px;align-items:flex-start}.pc li .i,.inc li .i{width:16px;height:16px;color:var(--br);margin-top:3px}
.inc{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.steps{list-style:none;padding:0;display:grid;gap:10px;margin:12px 0}
.st{display:flex;gap:12px;align-items:center}
.st span{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--mu);flex:none}
.st.done span{background:var(--br);color:#fff}.st.now span{background:var(--as);color:#b45309}
.st b{display:block;font-size:14px;line-height:1.2}.st small{color:var(--mu);font-size:12.5px}
.cf{position:relative;border:2px dashed var(--ln);border-radius:14px;padding:16px;text-align:center;background:var(--bg)}
.cf.lk>div{filter:blur(2.5px);opacity:.45}
.cf .lo{position:absolute;inset:0;display:grid;place-items:center;color:var(--mu);font-weight:700;font-size:13px}
.cf.ok{border-color:var(--br);border-style:solid}
.cf h4{font-size:15px}.shade{display:none}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
@media (max-width:820px){
.app{grid-template-columns:1fr}
aside{position:fixed;z-index:30;left:0;top:0;width:270px;transform:translateX(-105%);transition:transform .25s;padding-top:calc(22px + env(safe-area-inset-top,0px))}
body.open aside{transform:none}
body.open .shade{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.mn{display:grid}.sr,.me div{display:none}.me{padding:4px}
.top{padding:12px 16px}.v{padding:6px 16px 40px}
.hero{padding:22px}.hero h2{font-size:25px}.lg{grid-template-columns:1fr}
}
@media (max-width:480px){.g4{gap:10px}.stat{flex-direction:column;align-items:flex-start;gap:8px}.tri{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Frontend branding: forest green, mint, Plus Jakarta Sans, and the existing logo. */
.logo i{background:none;box-shadow:none;width:36px;height:36px}.logo i svg{width:36px;height:36px}.logo b{color:#4ade80}
.btn{background:#06402b}.btn:hover{background:#0c5b3b}.btn.g{background:#eaf6ee;color:#14783a}.btn.w{background:#fff;color:#06402b}
.hero .btn:first-child{background:#4ade80;color:#04281b}nav a.on{background:#4ade80;color:#04281b;box-shadow:none}
.card{box-shadow:0 10px 28px -22px #06402b33}.top{background:#fff;border-bottom:1px solid #dbe7e0;margin-bottom:20px}.ib{cursor:pointer}
.top p{font-size:12px}.v{max-width:1500px;margin:auto}.hero{background:linear-gradient(120deg,#04281b,#075338)}
dialog{border:1px solid #dbe7e0;border-radius:20px;padding:24px;width:min(640px,calc(100% - 30px));max-height:88vh;overflow:auto;color:#12372a;background:#fff;box-shadow:0 25px 70px #001b1240}
dialog::backdrop{background:#001b1266}dialog p{color:#5b7267;margin-top:14px;font-size:14px;line-height:1.8}dialog h2{padding-right:38px}.close-dialog{position:absolute;right:18px;top:18px;border:1px solid #dbe7e0;background:white;border-radius:8px;width:32px;height:32px;font-size:20px;cursor:pointer}
.demo-note{font-size:12px;color:#5b7267;background:#f3f9f5;border:1px solid #dbe7e0;border-radius:10px;padding:11px 14px}.tutor-chat{display:grid;gap:14px;margin:20px 0}.tutor-chat div{background:#f3f9f5;border:1px solid #dbe7e0;border-radius:12px;padding:16px;font-size:14px;white-space:pre-line}.tutor-chat .user{background:#06402b;color:white;border-color:#06402b;margin-left:35px}.tutor-form{display:flex;gap:10px}.tutor-form input{min-width:0;flex:1;border:1px solid #dbe7e0;padding:12px 14px;border-radius:10px;font:inherit}.tutor-examples{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.tutor-examples button{border:1px solid #dbe7e0;border-radius:9px;background:white;padding:8px 12px;color:#14783a;cursor:pointer;font:inherit;font-size:13px}.simple-alert{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#06402b;color:white;padding:12px 20px;border-radius:12px;z-index:100;font-size:13px;max-width:calc(100% - 30px)}
</style>
</head>
<body>
<div class="app">
<aside>
  <a class="logo" href="../" style="text-decoration:none" aria-label="GlobeLearn website"><i id="lg"></i><span>Globe<b>Learn</b></span></a>
  <small>Learn</small>
  <nav id="nv"></nav>
  <div class="sw"><a href="../" class="btn w" style="width:100%;margin-bottom:12px">Visit GlobeLearn website</a><p>Your GlobeP2P account works here too.</p><button class="btn w" style="width:100%" id="sg"></button></div>
</aside>
<div class="shade" onclick="document.body.classList.remove('open')"></div>
<main>
  <header class="top">
    <button class="mn" aria-label="Open menu" id="mb"></button>
    <div><h1 id="ttl"></h1><p id="sub"></p></div>
    <div class="sp"></div>
    <div class="sr"><span id="si"></span><input placeholder="Search courses, books, tests" aria-label="Search"></div>
    <button class="ib" id="bl" aria-label="Notifications"></button>
    <div class="me"><div class="av">A</div><div><b>Atta Ullah</b><small>Professional package</small></div></div>
  </header>
  <div id="v" class="v"></div>
</main>
</div>
<dialog id="simple-dialog" aria-label="Dashboard details"></dialog><div id="simple-alert" role="status" hidden></div>
<script>

let tutorMessages=[];
V.ai=()=>`<section class="hero"><div><h2>A little help with your next step.</h2><p>Ask a question, revise a lesson, or make a simple study plan.</p></div><div class="big">${I('bot')}</div></section><section class="card"><div class="hd"><h2>Globe AI Tutor</h2><span class="bd">Included with your package</span></div><p class="demo-note">Design preview · Example replies are shown until the AI service is connected.</p><div class="tutor-chat"><div>Hello, Atta. What would you like to learn today?</div>${tutorMessages.map(m=>`<div class="${m.user?'user':''}">${safe(m.text)}</div>`).join('')}</div><form class="tutor-form" id="tutor-form"><input required name="question" aria-label="Your learning question" placeholder="Ask a learning question…"><button class="btn">Send</button></form><div class="tutor-examples"><button data-prompt="Explain HTML and CSS">Explain HTML and CSS</button><button data-prompt="Make a study plan">Make a study plan</button><button data-prompt="Help with Excel">Help with Excel</button></div></section>`;
V.package=()=>`<section class="hero"><div><span class="tag">Your active package</span><h2 style="margin-top:12px">${K[CUR][0]} · $${K[CUR][1]}</h2><p>Includes every earlier package, lifetime course access, the Digital Library, free AI Tutor, and MCQ tests.</p></div></section><div class="pg">${K.map((p,i)=>`<article class="card pc ${i===CUR?'cur':''}"><span class="bd ${i>3?'o':''}" style="align-self:flex-start">${i>3?'Coming soon':i===CUR?'Current package':i<CUR?'Included':'Available'}</span><h2>${p[0]}</h2><div class="pr">$${p[1]}</div><ul>${p[2].map(f=>`<li>${I('check')}${f}</li>`).join('')}${i>0?`<li>${I('check')}Everything in ${K[i-1][0]}</li>`:''}</ul>${i>3?`<button class="btn g" data-interest="${i}" style="margin-top:auto">Notify me</button>`:i>CUR?`<button class="btn" data-upgrade="${i}" style="margin-top:auto">View upgrade</button>`:`<button class="btn g" disabled style="margin-top:auto">${i===CUR?'Your active package':'Included in your package'}</button>`}</article>`).join('')}</div><div class="card"><h2>One account. Connected learning.</h2><p class="mu" style="margin-top:10px">Your package is activated through GlobeP2P. Each higher package includes the earlier packages. Advanced and Agentic are coming soon, as shown on the frontend.</p></div>`;
function tutorReply(text){tutorMessages.push({user:true,text});const t=text.toLowerCase();tutorMessages.push({text:t.includes('excel')?'Try =SUM(A1:A5) to add values in five cells. A1 is a cell reference: column A, row 1.\n\nPractice: enter five numbers, calculate their total, and change one number. Watch how the result updates.':t.includes('html')||t.includes('css')?'HTML gives a web page its structure. CSS controls its colours, spacing, and layout.\n\nPractice: create a heading and a paragraph in HTML, then style them with CSS.':t.includes('plan')?'A simple five-day study plan:\n\n1. Watch one lesson and write a short summary.\n2. Practise the example yourself.\n3. Review the difficult parts.\n4. Apply the idea to a small project.\n5. Take a practice test and review your answers.':'Break the topic into one small question. Explain what you already understand, try an example, and revisit the part that feels unclear.\n\nTry the HTML, Excel, or study-plan examples above.'});re()}
document.addEventListener('submit',e=>{if(e.target.id==='tutor-form'){e.preventDefault();tutorReply(new FormData(e.target).get('question'))}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-lesson],[data-read],[data-download],[data-certificate],[data-prompt],[data-upgrade],[data-interest]');if(!el)return;
if(el.dataset.lesson!==undefined){const c=C.find(c=>c.id===el.dataset.course),l=c.lec[Number(el.dataset.lesson)];popup(l[0],`<p>${safe(l[1])}</p><ul class="inc" style="margin:18px 0">${l[2].map(t=>`<li>${I('check')}${safe(t)}</li>`).join('')}</ul><div class="demo-note">Recorded lesson preview · The course video will be attached when the backend content is ready.</div><button class="btn" style="margin-top:18px" id="complete-preview">Mark lesson complete</button>`);document.querySelector('#complete-preview').onclick=()=>{const current=Number(el.dataset.lesson)===2&&c.done<c.total;if(current)c.done=Math.min(c.total,c.done+1);document.querySelector('#simple-dialog').close();re();alertMessage(current?'Lesson completed. Your progress has been updated.':'Lesson reviewed.')}}
if(el.dataset.read){popup(el.dataset.read,'<p class="demo-note">Reader preview · Original GlobeLearn study guidance.</p>'+studyText.split('\n\n').slice(1,-1).map(t=>'<p>'+safe(t)+'</p>').join(''))}
if(el.dataset.download)saveFile(el.dataset.download+' - study companion.txt',el.dataset.download+'\n\n'+studyText);
if(el.dataset.certificate){const c=C.find(c=>c.id===el.dataset.certificate);saveFile('GlobeLearn - '+c.n+'.svg',`<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700"><rect width="1000" height="700" fill="#f3f9f5"/><rect x="25" y="25" width="950" height="650" fill="white" stroke="#16a34a" stroke-width="2"/><g text-anchor="middle" fill="#06402b" font-family="Georgia,serif"><text x="500" y="140" font-size="24">GlobeLearn · Online Education</text><text x="500" y="235" font-size="42">Certificate of Completion</text><text x="500" y="325" font-size="22">Presented to</text><text x="500" y="385" font-size="38">Atta Ullah</text><text x="500" y="455" font-size="20">for completing</text><text x="500" y="505" font-size="29">${safe(c.n)}</text><text x="500" y="600" font-size="16">Design preview · Sample certificate</text></g></svg>`,'image/svg+xml')}
if(el.dataset.prompt)tutorReply(el.dataset.prompt);
if(el.dataset.interest)alertMessage('Your interest is noted in this preview.');
if(el.dataset.upgrade){const i=Number(el.dataset.upgrade);popup(K[i][0]+' package',`<p>$${K[i][1]} package · Includes everything in your current package.</p><p class="demo-note">Package activation will be completed through GlobeP2P once connected.</p>`)}
});
document.querySelector('#bl').onclick=()=>popup('Your notifications','<p><b>Computer Basics certificate ready</b><br>You completed the course and passed its assessment.</p><p><b>Keep your learning going</b><br>Resume your next Full Stack Web Development lesson.</p>');
document.querySelector('#sg').onclick=()=>popup('Your connected account','<p>Your GlobeP2P account connects your courses, package, and learning progress.</p><p class="demo-note">The account switch will open GlobeP2P when the real connection is added.</p>');
const search=document.querySelector('.sr input');search.addEventListener('keydown',e=>{if(e.key==='Enter'){const q=search.value.toLowerCase().trim();if(!q)return;const cs=C.filter(c=>c.n.toLowerCase().includes(q)),bs=[...L,...N].filter(b=>b[0].toLowerCase().includes(q));popup('Search results',cs.map(c=>`<p><a class="btn g" href="#courses" onclick="S.c='${c.id}';document.querySelector('#simple-dialog').close();re()">${safe(c.n)}</a></p>`).join('')+bs.map(b=>`<p>${safe(b[0])} · Digital library</p>`).join('')||'<p>No matching courses or resources. Try another keyword.</p>')}});
go();

</script>
</body>
</html>
